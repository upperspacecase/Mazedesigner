<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9x9 Maze Designer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>9&times;9 Maze Designer</h1>
      <p class="subtitle">
        Every cell is a room; walls live between cells. The center 3&times;3 is one open chamber.
        Pick 1&ndash;4 side entrances and hit Generate.
      </p>
    </header>

    <section class="controls">
      <div class="control-group">
        <span class="control-label">Generate</span>
        <select id="gen-style" class="select" title="How many loops in the maze">
          <option value="0">One path (perfect)</option>
          <option value="0.08" selected>A few loops</option>
          <option value="0.25">Many loops</option>
        </select>
        <button type="button" class="btn btn-primary" id="btn-generate">Generate maze</button>
      </div>

      <div class="control-group">
        <span class="control-label">Entrances</span>
        <button type="button" class="btn entrance-btn" data-side="top">Top</button>
        <button type="button" class="btn entrance-btn" data-side="right">Right</button>
        <button type="button" class="btn entrance-btn" data-side="bottom">Bottom</button>
        <button type="button" class="btn entrance-btn" data-side="left">Left</button>
        <button type="button" class="btn" id="btn-rand-entrances" title="Randomize 1–4 entrances">Random</button>
      </div>

      <div class="control-group">
        <span class="control-label">View</span>
        <button type="button" class="btn" id="btn-solution">Show solution</button>
        <button type="button" class="btn" id="btn-export">Export JSON</button>
      </div>
    </section>

    <section class="board">
      <svg id="maze-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <section class="status">
      <p id="status-line">Ready.</p>
    </section>

    <section class="io">
      <label for="json-area">Maze JSON</label>
      <textarea id="json-area" spellcheck="false" rows="6" readonly></textarea>
    </section>

    <section class="legend">
      <div><span class="swatch swatch-cell"></span> Room</div>
      <div><span class="swatch swatch-center"></span> Center chamber</div>
      <div><span class="swatch swatch-wall"></span> Wall</div>
      <div><span class="swatch swatch-entrance"></span> Entrance</div>
      <div><span class="swatch swatch-path"></span> Solution</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
