<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9x9 Flow Designer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>9&times;9 Flow Designer</h1>
      <p class="subtitle">
        Each entrance is its own colored snake. Snakes never cross, never dead-end,
        and together fill every cell. Every snake ends inside the center chamber.
      </p>
    </header>

    <section class="controls">
      <div class="control-group">
        <span class="control-label">Generate</span>
        <button type="button" class="btn btn-primary" id="btn-generate">Generate flow</button>
      </div>

      <div class="control-group">
        <span class="control-label">Entrances</span>
        <button type="button" class="btn entrance-btn" data-side="top">Top</button>
        <button type="button" class="btn entrance-btn" data-side="right">Right</button>
        <button type="button" class="btn entrance-btn" data-side="bottom">Bottom</button>
        <button type="button" class="btn entrance-btn" data-side="left">Left</button>
        <button type="button" class="btn" id="btn-rand-entrances" title="Randomize 1–4 entrances">Random</button>
      </div>

      <div class="control-group">
        <span class="control-label">Data</span>
        <button type="button" class="btn" id="btn-export">Export JSON</button>
      </div>
    </section>

    <section class="board">
      <svg id="maze-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <section class="status">
      <p id="status-line">Ready.</p>
    </section>

    <section class="io">
      <label for="json-area">Flow JSON</label>
      <textarea id="json-area" spellcheck="false" rows="6" readonly></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
